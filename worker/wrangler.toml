name = "robotics-xyz-add-company"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
GH_REPO = "kerffc/robotics-xyz"

# Optional: bind a KV namespace for per-IP rate limiting.
# Create with: wrangler kv namespace create RATE_LIMIT_KV
# Then uncomment and fill in the id below.
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# GH_TOKEN is set as a secret, not a var:
#   wrangler secret put GH_TOKEN

# TG_WEBHOOK_SECRET gates the /telegram-webhook route (must match the
# secret_token Telegram's setWebhook was registered with):
#   wrangler secret put TG_WEBHOOK_SECRET
