name: TEST - send approval draft

on:
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test draft
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python scripts/send_test_draft.py

      - name: Commit pending state
        run: |
          git config user.name "robotics-news-bot"
          git config user.email "actions@github.com"
          git add scripts/pending.json
          git diff --staged --quiet && exit 0
          git commit -m "Test: send approval pipeline test draft"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            sleep $((RANDOM % 10 + 1))
          done
          exit 1
